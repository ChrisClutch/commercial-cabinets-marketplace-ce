# If this folder stays inside the forgesalem-website repo, set
# "Base directory" to clutch-cabinets-directory in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Clean URLs: /shops/shop-name serves /shops/shop-name.html
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
