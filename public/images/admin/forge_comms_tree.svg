<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .black { fill: #1a1a1a; }
      .red { fill: #C0272D; }
      .gold { fill: #D4AF37; }
      .white-text { fill: #FFFFFF; }
      .black-text { fill: #1a1a1a; }
      .red-text { fill: #C0272D; }
      .muted-text { fill: #4a4a4a; }
      .card-bg { fill: #FAFAFA; stroke: #1a1a1a; stroke-width: 1.5; }
